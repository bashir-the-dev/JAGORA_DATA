<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ajdBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#0044EE" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002288" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Electric Blue App Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#ajdBlueGrad)" />

  <g filter="url(#subtleShadow)">
    <!-- 1. LETTER A -->
    <!-- Left Leg of A with bottom cut -->
    <path d="M 124 358 L 74 358 L 138 156 L 194 156 L 235 284 L 188 284 L 176 242 L 126 242 L 108 300 L 124 358 Z" fill="#FFFFFF" />
    <!-- Triangle Counter inside A -->
    <polygon points="151,192 135,242 167,242" fill="#0055FF" />

    <!-- 2. DYNAMIC SWOOP ARCH ACROSS A, J, AND TOP OF D -->
    <!-- Upper Arcing Swoop -->
    <path d="M 36 322 C 40 348, 70 354, 110 348 C 175 338, 230 250, 310 196 C 355 166, 400 160, 428 198 C 390 174, 335 180, 280 208 C 190 252, 130 338, 72 344 C 52 346, 42 336, 36 322 Z" fill="#FFFFFF" />

    <!-- 3. LETTER J (Centered between A and D) -->
    <!-- Vertical stem and curved bottom hook of J -->
    <path d="M 245 156 L 306 156 L 306 312 C 306 338, 290 360, 260 360 C 230 360, 206 345, 198 318 L 233 308 C 238 322, 246 328, 258 328 C 268 328, 273 320, 273 306 L 273 156 L 245 156 Z" fill="#FFFFFF" />

    <!-- 4. LETTER D (Massive right loop with integrated tech counter) -->
    <!-- Outer D structure -->
    <path d="M 285 156 L 370 156 C 430 156, 470 200, 470 262 C 470 326, 426 360, 365 360 L 285 360 Z" fill="#FFFFFF" />

    <!-- Crescent Echo on the lower-right of D -->
    <path d="M 445 230 C 466 255, 468 285, 452 312 C 458 290, 456 265, 445 230 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- 5. SMARTPHONE INNER SHAPE (Cutout inside D counter) -->
    <!-- Smartphone Chassis inside D -->
    <rect x="328" y="210" width="86" height="126" rx="18" fill="#0055FF" />
    
    <!-- Phone Screen Inset Line -->
    <rect x="336" y="222" width="70" height="102" rx="12" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
    
    <!-- Phone Top Speaker Slit -->
    <rect x="362" y="215" width="18" height="3" rx="1.5" fill="#FFFFFF" />

    <!-- WiFi / Broadband Signals inside Phone Screen -->
    <!-- Center Dot -->
    <circle cx="371" cy="298" r="5.5" fill="#FFFFFF" />

    <!-- First WiFi Wave Arc -->
    <path d="M 358 284 C 363 277, 379 277, 384 284" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

    <!-- Second WiFi Wave Arc -->
    <path d="M 350 270 C 361 259, 381 259, 392 270" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

    <!-- 6. DIGITAL TELECOM DATA PIXEL CLUSTER (Top-right corner of D) -->
    <!-- Top-Right Major Square -->
    <rect x="428" y="140" width="32" height="32" rx="6" fill="#FFFFFF" />
    
    <!-- Middle Right Square -->
    <rect x="458" y="176" width="24" height="24" rx="5" fill="#FFFFFF" />
    
    <!-- Inner Top-Left Pixel -->
    <rect x="404" y="156" width="18" height="18" rx="4" fill="#FFFFFF" />
    
    <!-- Inner Middle Pixel -->
    <rect x="426" y="178" width="24" height="24" rx="5" fill="#FFFFFF" />
    
    <!-- Bottom Pixel -->
    <rect x="448" y="206" width="19" height="19" rx="4" fill="#FFFFFF" />
  </g>
</svg>
